{% if LINKS %}
  {% from 'includes/sidebar/macros.jinja' import title %}
  {% set SIDEBAR_ICONS = not DISABLE_SIDEBAR_TITLE_ICONS %}

<!-- Sidebar/Links -->
<li class="list-group-item">
  <h4>{{ title(_('Links'), not SIDEBAR_ICONS, icon='box-arrow-up-right') }}</h4>
  <ul class="list-group" id="links">
    {% for name, link in LINKS %}
    <li class="list-group-item">
      <a href="{{ link }}" target="_blank">{{ name }}</a>
    </li>
    {% endfor %}
  </ul>
</li>
<!-- End Sidebar/Links -->
{% endif %}
